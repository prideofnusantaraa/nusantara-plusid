.view{display:none}.view.on{display:block}.wrap{max-width:1120px;margin:0 auto;padding:72px 20px}
.btn{display:inline-block;border:0;cursor:pointer;font:700 1rem "Plus Jakarta Sans",sans-serif;padding:14px 26px;border-radius:99px;background:var(--go);color:var(--g1);text-decoration:none;transition:transform .2s}

.hero{position:relative;min-height:calc(100vh - 62px);overflow:hidden;background:var(--g1);color:var(--cr);display:grid;align-items:center}
.bgv{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:20px;max-width:1120px;margin:auto;padding:40px 20px;align-items:center;width:100%}
.hero p{font-size:1.15rem;opacity:.92}.hero .tag{color:var(--go);font-weight:700}

.pbx .ph{position:absolute;inset:14px 14px 96px;border-radius:26px}.pbx .lg{position:absolute;left:30px;right:30px;bottom:44px;height:42px;object-fit:contain;width:calc(100% - 60px)}

.lf{position:fixed;width:16px;height:16px;border-radius:0 100% 0 100%;background:var(--g2);pointer-events:none;z-index:70;animation:lf 1.6s ease-out forwards}.lf:nth-child(3n){background:var(--go)}
@keyframes lf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

{id:'komodo',img:'Komodo_dragon_at_Komodo_National_Park_Indonesia.jpg',col:['#3b3a22','#8a7a4a'],n:'Komodo',en:'Komodo dragon',sci:'Varanus komodoensis',st:['Endangered','Terancam Punah'],t:2,h:['Komodo, Rinca and Flores, East Nusa Tenggara','Pulau Komodo, Rinca, dan Flores, Nusa Tenggara Timur'],f:[['The heaviest lizard on Earth','Can grow to about 3 meters long','Smells prey from far away with its forked tongue'],['Kadal terberat di dunia','Bisa tumbuh hingga sekitar 3 meter','Mencium mangsa dari jauh dengan lidah bercabang']],th:['Habitat loss, fewer prey animals and rising sea levels on its island coasts.','Hilangnya habitat, berkurangnya mangsa, dan naiknya permukaan laut di pesisir pulaunya.'],c:['Visit with licensed guides, follow park rules and support community-based conservation tourism.','Berkunjung dengan pemandu resmi, patuhi aturan taman, dan dukung wisata konservasi berbasis masyarakat.']},
{id:'rafflesia',img:'Rafflesia-Arnoldii.jpg',col:['#4a1410','#c0443b'],n:'Rafflesia Arnoldii',en:'Corpse flower',sci:'Rafflesia arnoldii',st:['Protected, threatened','Dilindungi, terancam'],t:2,h:['Lowland rainforests of Sumatra, especially Bengkulu','Hutan hujan dataran rendah Sumatra, terutama Bengkulu'],f:[['One of the largest flowers in the world, up to about 1 meter wide','Has no leaves, stems or roots and lives on Tetrastigma vines','Blooms for only a few days'],['Salah satu bunga terbesar di dunia, lebar hingga sekitar 1 meter','Tanpa daun, batang, atau akar dan hidup pada liana Tetrastigma','Mekar hanya beberapa hari']],th:['Forest clearing, loss of its host vines and the picking of buds.','Pembukaan hutan, hilangnya liana inang, dan pemetikan kuncup.'],c:['Protect lowland forest, never pick buds and visit community-run conservation sites.','Lindungi hutan dataran rendah, jangan petik kuncup, dan kunjungi lokasi konservasi yang dikelola masyarakat.']},
{id:'cenderawasih',img:'Cenderawasih_Bird_-_Papua.jpg',col:['#123D2A','#d6a94a'],n:'Cenderawasih',en:'Bird-of-paradise',sci:'Paradisaea apoda',st:['Protected in Indonesia','Dilindungi di Indonesia'],t:1,h:['Lowland forests of Papua and the Aru Islands','Hutan dataran rendah Papua dan Kepulauan Aru'],f:[['Males dance to show off long golden plumes','Known in Indonesia as the bird of paradise','Plumes were once heavily hunted for fashion'],['Jantan menari memamerkan bulu emas yang panjang','Dikenal di Indonesia sebagai burung surga','Bulunya dulu diburu besar-besaran untuk mode']],th:['Logging, forest conversion and hunting for plumes.','Penebangan, alih fungsi hutan, dan perburuan bulu.'],c:['Support Papuan forest guardians, avoid feather souvenirs and choose bird-watching over trade.','Dukung penjaga hutan Papua, hindari suvenir bulu, dan pilih pengamatan burung daripada perdagangan.']},
